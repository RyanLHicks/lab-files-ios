name: Lab
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # The App Group as it ends after free-team signing: group.<app bundle id>.<TEAMID>. CI passes the real value.
    LAB_APP_GROUP: group.io.github.ryanlhicks.lab.TEAMID
    CODE_SIGNING_ALLOWED: "NO"
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Lab:
    type: application
    platform: iOS
    sources: [App]
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: Lab
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ryanlhicks.lab
        INFOPLIST_FILE: App/Info.plist
    dependencies:
      - target: LabFiles
  LabFiles:
    type: app-extension
    platform: iOS
    sources: [LabFiles]
    settings:
      base:
        PRODUCT_NAME: LabFiles
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ryanlhicks.lab.files
        INFOPLIST_FILE: LabFiles/Info.plist
